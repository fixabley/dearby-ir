<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<meta name="description" content="원하는 직무와 경험으로 교외 활동을 찾는 앱, Dearby. 학교·프로젝트 발표자료, 본문 12장과 부록 3장.">
<title>Dearby | 제품 재기획 발표</title>
<style>__CSS__</style>
</head>
<body>
<a class="skip" href="#stage">발표 내용으로 이동</a>
<header class="toolbar"><span class="toolbar-brand">Dearby</span><div class="tools"><label><span class="sr-only">슬라이드 선택</span><select id="slide-select">__OPTIONS__</select></label><button id="notes-toggle" aria-expanded="false" aria-controls="notes">발표 원고</button><button id="fullscreen">전체화면</button><button id="print">인쇄 / PDF</button></div></header>
<main class="viewport" id="viewport"><div class="stage-wrap" id="stage-wrap"><div class="stage" id="stage">__SLIDES__</div></div></main>
<nav class="controls" aria-label="슬라이드 이동"><button id="prev" aria-label="이전 슬라이드">← 이전</button><span class="counter" id="counter" aria-live="polite"></span><button id="next" aria-label="다음 슬라이드">다음 →</button><span class="keyboard-help">← → 이동 &nbsp; N 원고 &nbsp; F 전체화면</span></nav>
<p class="notice" id="notice" role="status" hidden></p>
<aside class="notes" id="notes" aria-label="발표자 원고" hidden><h2 id="notes-title"></h2><p id="notes-body"></p><p id="notes-meta" class="meta"></p></aside>
<script id="notes-data" type="application/json">__NOTES__</script>
<script>
'use strict';
const slides=[...document.querySelectorAll('.slide')];
const notes=JSON.parse(document.getElementById('notes-data').textContent);
const select=document.getElementById('slide-select');
const prev=document.getElementById('prev'), next=document.getElementById('next');
const notesPanel=document.getElementById('notes'), notesToggle=document.getElementById('notes-toggle');
const full=document.getElementById('fullscreen');
const viewport=document.getElementById('viewport'), wrap=document.getElementById('stage-wrap'), stage=document.getElementById('stage');
let current=0;
function fit(){
 if(window.innerWidth<700){stage.style.transform='';wrap.style.width='';wrap.style.height='';return;}
 const style=getComputedStyle(viewport);
 const w=viewport.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight);
 const h=viewport.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);
 const scale=Math.min(w/1440,h/810,1.5);
 stage.style.transform='scale('+scale+')';wrap.style.width=(1440*scale)+'px';wrap.style.height=(810*scale)+'px';
}
function show(index, updateHash=true){
 current=Math.max(0,Math.min(slides.length-1,index));
 slides.forEach((slide,i)=>{slide.hidden=i!==current;});
 select.value=String(current);prev.disabled=current===0;next.disabled=current===slides.length-1;
 document.getElementById('counter').textContent=(current+1)+' / '+slides.length;
 document.title='Dearby | '+notes[current].title;
 document.getElementById('notes-title').textContent=notes[current].title;
 document.getElementById('notes-body').textContent=notes[current].notes;
 document.getElementById('notes-meta').textContent=notes[current].status+(notes[current].seconds?' · 권장 '+notes[current].seconds+'초':' · 질의응답용 부록');
 if(updateHash){try{history.replaceState(null,'','#slide-'+(current+1));}catch{location.hash='slide-'+(current+1);}}
 window.scrollTo({top:0,behavior:'instant'});
}
function fromHash(){const match=location.hash.match(/^#slide-(\d+)$/);show(match?Number(match[1])-1:0,false);}
function toggleNotes(){notesPanel.hidden=!notesPanel.hidden;notesToggle.setAttribute('aria-expanded',String(!notesPanel.hidden));if(!notesPanel.hidden)notesPanel.scrollIntoView({block:'nearest',behavior:'instant'});}
async function fullscreen(){
 try{if(document.fullscreenElement){await document.exitFullscreen();}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();}else{throw new Error('unsupported');}}
 catch{const el=document.getElementById('notice');el.hidden=false;el.textContent='브라우저의 전체화면 메뉴를 이용해 주세요.';}
}
prev.addEventListener('click',()=>show(current-1));next.addEventListener('click',()=>show(current+1));
select.addEventListener('change',()=>show(Number(select.value)));
notesToggle.addEventListener('click',toggleNotes);full.addEventListener('click',fullscreen);
document.getElementById('print').addEventListener('click',()=>window.print());
document.addEventListener('fullscreenchange',()=>{full.textContent=document.fullscreenElement?'전체화면 종료':'전체화면';fit();});
document.addEventListener('keydown',event=>{
 if(event.ctrlKey||event.metaKey||event.altKey||event.target.closest('input,textarea,select,[contenteditable="true"]'))return;
 const k=event.key.toLowerCase();
 if(k===' '&&event.target.closest('button'))return;
 if(['arrowright','pagedown',' ','arrowleft','pageup','home','end','n','f'].includes(k))event.preventDefault();
 if(['arrowright','pagedown',' '].includes(k))show(current+1);
 else if(['arrowleft','pageup'].includes(k))show(current-1);
 else if(k==='home')show(0);else if(k==='end')show(slides.length-1);
 else if(k==='n')toggleNotes();else if(k==='f')fullscreen();
});
window.addEventListener('hashchange',fromHash);
new ResizeObserver(fit).observe(viewport);
fromHash();fit();
</script>
</body>
</html>
